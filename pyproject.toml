[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-driven-coding"
version = "1.2.0"
description = "Progressive, evidence-driven task records for AI-assisted software work"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "凸( →_→ )凸"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[project.scripts]
idc = "idc_core.inspect_cli:main"

[tool.setuptools]
packages = ["idc_core", "idc_core.resources"]

[tool.setuptools.package-data]
"idc_core.resources" = ["*.json"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["fixtures", "templates"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/idc.py" = ["E402"]
"tests/test_repository.py" = ["E402"]
