[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-driven-coding"
version = "1.1.0"
description = "Progressive, evidence-driven task records for AI-assisted software work"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "凸( →_→ )凸"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
idc = "idc_core.inspect_cli:main"

[tool.setuptools]
packages = ["idc_core", "idc_core.resources"]

[tool.setuptools.package-data]
"idc_core.resources" = ["*.json"]

